<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Visualization title | Everyday With AI</title>
<style>
:root{--ink:#20252b;--muted:#626b75;--paper:#f7f8fa;--card:#fff;--line:#cbd2d8;--blue:#2868d8;--blue-soft:#eaf1ff;--teal:#138b82;--teal-soft:#e6f6f3;--orange:#d47727;--orange-soft:#fff0df;--mesh-dot:#858f98;--shadow:0 18px 48px rgba(32,37,43,.11)}
  *{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.sheet,.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden}.sheet{aspect-ratio:16/9}.scene{background:var(--paper)}.scene-content{position:relative;z-index:2;width:100%;height:100%;padding:76px 108px 56px;display:grid;grid-template-rows:auto 1fr auto;gap:34px}.ambient{position:absolute;inset:-80px;z-index:0;opacity:.32;pointer-events:none}.ambient svg{width:100%;height:100%}.mesh-dot{fill:var(--mesh-dot);opacity:.78}.kicker{margin:0 0 14px;color:var(--blue);font-size:20px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:76px;line-height:.98;letter-spacing:-.048em;max-width:1220px}.stage{display:grid;align-content:center;gap:28px}.panel{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:24px;padding:36px 40px;box-shadow:var(--shadow);font-size:28px}footer{position:relative;height:48px;border-top:0}.takeaway,.note{margin:0}
  #kicker{animation:rise .5s cubic-bezier(.2,.8,.2,1) .12s both}#headline{animation:rise .7s cubic-bezier(.2,.8,.2,1) .38s both}.stage{animation:rise .62s cubic-bezier(.2,.8,.2,1) 1.05s both}#dot-field{animation:scatterDrift 6.4s linear both}@keyframes rise{from{opacity:0;transform:translateY(30px)}}@keyframes scatterDrift{to{transform:translate(-76px,-46px)}}
</style>
</head>
<body>
<main id="main" class="sheet" data-composition-id="main" data-no-timeline data-width="1920" data-height="1080" data-start="0" data-duration="6.4">
  <section class="scene">
    <div class="ambient" data-eai-background="scatter-drift" data-layout-allow-overflow aria-hidden="true">
      <svg viewBox="0 0 2080 1240" preserveAspectRatio="none">
        <defs>
          <pattern id="scatter-grid" width="240" height="180" patternUnits="userSpaceOnUse">
            <circle class="mesh-dot" cx="22" cy="28" r="3.5"/>
            <circle class="mesh-dot" cx="86" cy="18" r="2.4"/>
            <circle class="mesh-dot" cx="168" cy="44" r="4.2"/>
            <circle class="mesh-dot" cx="221" cy="16" r="2.8"/>
            <circle class="mesh-dot" cx="48" cy="96" r="4.6"/>
            <circle class="mesh-dot" cx="131" cy="82" r="2.5"/>
            <circle class="mesh-dot" cx="205" cy="111" r="3.4"/>
            <circle class="mesh-dot" cx="17" cy="158" r="2.6"/>
            <circle class="mesh-dot" cx="112" cy="151" r="3.8"/>
            <circle class="mesh-dot" cx="188" cy="166" r="2.3"/>
          </pattern>
        </defs>
        <g id="dot-field" data-layout-allow-overflow>
          <rect x="-220" y="-180" width="2560" height="1600" fill="url(#scatter-grid)"/>
        </g>
      </svg>
    </div>
    <div class="scene-content">
      <header><p class="kicker" id="kicker">Short section label</p><h1 id="headline">One clear idea.</h1></header>
      <section class="stage"><div class="panel">Replace this panel with the smallest layout that explains the relationship.</div></section>
      <footer><p class="takeaway" aria-hidden="true"></p><p class="note" aria-hidden="true"></p></footer>
    </div>
  </section>
</main>
</body>
</html>
