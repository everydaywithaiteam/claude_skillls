<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop choosing a mode — describe the outcome</title>
<style>
:root{--ink:#20252b;--muted:#68717b;--paper:#f7f8fa;--card:#fff;--line:#cbd2d8;--blue:#2868d8;--blue-soft:#eaf1ff;--teal:#138b82;--teal-soft:#e6f6f3;--orange:#d47727;--orange-soft:#fff0df;--shadow:0 10px 28px rgba(32,37,43,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:grid;place-items:center;padding:38px;min-height:100vh}.sheet{width:min(100%,1480px);aspect-ratio:16/9;min-height:640px;background:var(--paper);padding:34px 44px 26px;display:grid;grid-template-rows:auto 1fr auto;gap:20px}
header{display:flex;justify-content:space-between;align-items:end;gap:28px}.kicker{margin:0 0 10px;color:var(--blue);font-size:14px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(32px,3.6vw,54px);line-height:1;letter-spacing:-.042em;max-width:900px}.dek{margin:0 0 4px;max-width:390px;color:var(--muted);font-size:clamp(15px,1.25vw,18px);line-height:1.4;text-align:right}
.stage{display:grid;grid-template-columns:1fr 84px 1.16fr;align-items:center;gap:18px}.panel{min-height:245px;border-radius:22px;padding:28px;display:grid;align-content:center;gap:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.panel.before{border-top:6px solid var(--orange)}.panel.after{background:var(--teal-soft);border:2px solid var(--teal)}.label{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:var(--orange-soft);border:1px solid #efc89e;border-radius:14px;padding:19px;text-align:center;color:var(--orange);font-size:clamp(20px,2vw,29px);font-weight:800}.question{margin:0;color:var(--muted);font-size:clamp(15px,1.2vw,18px)}.composer{background:#fff;border:2px solid #9fd8cf;border-radius:17px;padding:22px;color:var(--ink);font-size:clamp(20px,2vw,30px);font-weight:750}.after strong{color:var(--teal);font-size:clamp(23px,2.3vw,34px);letter-spacing:-.03em}.arrow{display:grid;place-items:center;color:var(--teal);font-size:54px;font-weight:800}
footer{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:0;padding-top:14px}.takeaway{margin:0;font-size:clamp(16px,1.4vw,21px);font-weight:700}.note{margin:0;color:var(--muted);font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;white-space:nowrap}
@media(max-height:800px) and (min-width:901px){body{padding:14px}.sheet{width:min(100%,1200px);min-height:0;padding:27px 38px 22px;gap:14px}.panel{min-height:220px;padding:23px}}
@media(max-width:900px){body{padding:12px}.sheet{aspect-ratio:auto;min-height:0;padding:24px}.stage{grid-template-columns:1fr}.arrow{transform:rotate(90deg);font-size:38px}.dek{display:none}}
</style>
</head>
<body>
<main class="sheet">
<header><div><p class="kicker">The workflow shift</p><h1>Stop choosing a mode.<br>Describe the outcome.</h1></div></header>
<section class="stage">
  <article class="panel before"><span class="label">Earlier experience</span><div class="choices"><div class="choice">Chat</div><div class="choice">Cowork</div></div><p class="question">Which mode should handle this?</p></article>
  <div class="arrow" aria-hidden="true">→</div>
  <article class="panel after"><span class="label">One starting point</span><strong>Describe what “done” looks like.</strong><div class="composer">Create a concise Notion briefing…</div></article>
</section>
<footer><p class="takeaway">Everyday with AI</p><p class="note" aria-hidden="true"></p></footer>
</main>
</body>
</html>
