<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What actually merged in Claude</title>
<style>
:root{--ink:#20252b;--muted:#68717b;--paper:#f7f8fa;--card:#fff;--line:#cbd2d8;--blue:#2868d8;--blue-soft:#eaf1ff;--teal:#138b82;--teal-soft:#e6f6f3;--orange:#d47727;--orange-soft:#fff0df;--shadow:0 10px 28px rgba(32,37,43,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:grid;place-items:center;padding:38px;min-height:100vh}.sheet{width:min(100%,1480px);aspect-ratio:16/9;min-height:640px;background:var(--paper);padding:34px 44px 26px;display:grid;grid-template-rows:auto 1fr auto;gap:20px}
header{display:flex;justify-content:space-between;align-items:end;gap:28px}.kicker{margin:0 0 10px;color:var(--blue);font-size:14px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(32px,3.6vw,54px);line-height:1;letter-spacing:-.042em;max-width:900px}.dek{margin:0 0 4px;max-width:410px;color:var(--muted);font-size:clamp(15px,1.25vw,18px);line-height:1.4;text-align:right}
.stage{display:grid;grid-template-columns:1.45fr .8fr;gap:28px;align-content:center}.merged{background:var(--teal-soft);border:2px solid var(--teal);border-radius:22px;padding:24px;display:grid;gap:17px;box-shadow:var(--shadow)}.label{color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input{background:#fff;border:1px solid #bfe4dd;border-radius:14px;padding:20px;text-align:center;font-size:clamp(21px,2vw,30px);font-weight:800}.join{text-align:center;color:var(--teal);font-size:33px;line-height:.6}.destination{background:#fff;border:2px solid var(--teal);border-radius:17px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:18px}.destination strong{color:var(--teal);font-size:clamp(27px,2.5vw,38px);letter-spacing:-.035em}.destination span{color:var(--muted);font-size:clamp(13px,1vw,16px);text-align:right}.separate{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--blue);border-radius:20px;padding:26px;display:grid;align-content:center;gap:14px;box-shadow:var(--shadow)}.separate h2{margin:0;color:var(--blue);font-size:clamp(27px,2.5vw,38px);letter-spacing:-.035em}.separate p{margin:0;color:var(--muted);font-size:clamp(15px,1.2vw,18px);line-height:1.4}.status{justify-self:start;background:var(--blue-soft);border:1px solid #bcd3ff;color:var(--blue);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800}
footer{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:0;padding-top:14px}.takeaway{margin:0;font-size:clamp(16px,1.4vw,21px);font-weight:700}.note{margin:0;color:var(--muted);font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;white-space:nowrap}
@media(max-height:800px) and (min-width:901px){body{padding:14px}.sheet{width:min(100%,1200px);min-height:0;padding:27px 38px 22px;gap:14px}.merged{padding:20px}.separate{padding:22px}}
@media(max-width:900px){body{padding:12px}.sheet{aspect-ratio:auto;min-height:0;padding:24px}.stage{grid-template-columns:1fr}.dek{display:none}}
</style>
</head>
<body>
<main class="sheet">
<header><div><p class="kicker">The clean correction</p><h1>Chat and Cowork merged.<br>Claude Code did not.</h1></div></header>
<section class="stage">
  <article class="merged"><span class="label">Now one experience</span><div class="inputs"><div class="input">Chat</div><div class="input">Cowork</div></div><div class="join">↓</div><div class="destination"><strong>Claude</strong><span>One conversation<br>One Recents list</span></div></article>
  <article class="separate"><span class="label">Still its own workspace</span><h2>Claude Code</h2><p>A dedicated coding environment with separate project access.</p><span class="status">Still separate</span></article>
</section>
<footer><p class="takeaway">Everyday with AI</p><p class="note" aria-hidden="true"></p></footer>
</main>
</body>
</html>
